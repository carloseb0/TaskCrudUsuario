version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_app

    working_dir: /var/www

    volumes:
      - ./src:/var/www

    depends_on:
      - mysql
      - redis

    networks:
      - laravel

  nginx:

    image: nginx:latest

    container_name: laravel_nginx

    ports:
      - "8000:80"

    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

  mysql:

    image: mysql:8.4

    container_name: laravel_mysql

    restart: always

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

  redis:

    image: redis:7

    container_name: laravel_redis

    ports:
      - "6379:6379"

    networks:
      - laravel

  phpmyadmin:

    image: phpmyadmin/phpmyadmin

    container_name: laravel_phpmyadmin

    restart: always

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root

    depends_on:
      - mysql

    networks:
      - laravel

volumes:

  mysql_data:

networks:

  laravel: